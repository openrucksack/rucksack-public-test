oke="#313547" stroke-width="2"/><text x="534" y="196" font-size="16" font-weight="800" fill="#313547" text-anchor="middle">✓</text><text x="560" y="196" font-size="17" font-weight="600" fill="#1F2230" text-anchor="start">AI tools you allow</text><circle cx="534" cy="236" r="14" fill="#FFFFFF" stroke="#7C5F57" stroke-width="2"/><text x="534" y="242" font-size="16" font-weight="800" fill="#7C5F57" text-anchor="middle">✗</text><text x="560" y="242" font-size="17" font-weight="600" fill="#1F2230" text-anchor="start">Everyone else</text><text x="40" y="352" font-size="17" font-weight="700" fill="#1F2230" text-anchor="start">Every change is kept, so nothing is lost</text><line x1="40" y1="382" x2="860" y2="382" stroke="#A08077" stroke-width="2.5"/><circle cx="80" cy="382" r="8" fill="#313547"/><text x="80" y="410" font-size="14" font-weight="600" fill="#5A5E6E" text-anchor="middle">created</text><circle cx="330" cy="382" r="8" fill="#313547"/><text x="330" y="410" font-size="14" font-weight="600" fill="#5A5E6E" text-anchor="middle">your answers</text><circle cx="580" cy="382" r="8" fill="#313547"/><text x="580" y="410" font-size="14" font-weight="600" fill="#5A5E6E" text-anchor="middle">a note</text><circle cx="830" cy="382" r="8" fill="#313547"/><text x="830" y="410" font-size="14" font-weight="600" fill="#5A5E6E" text-anchor="middle">today</text></svg>