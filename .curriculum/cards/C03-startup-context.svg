<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-label="Before your first message, a chat reads the app&#x27;s own instructions, then your custom instructions, which point it to your rucksack&#x27;s start page; all of this sits in the context window" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif"><rect width="900" height="480" rx="24" fill="#EFEDEC"/><text x="40" y="56" font-size="26" font-weight="800" fill="#1F2230" text-anchor="start">Startup context: what a chat reads first</text><rect x="40" y="90" width="520" height="62" rx="16" fill="#FFFFFF" stroke="#E3DFDD" stroke-width="2"/><text x="58" y="124" font-size="18" font-weight="700" fill="#1F2230" text-anchor="start">The app&#x27;s own instructions</text><text x="58" y="142" font-size="14" font-weight="500" fill="#5A5E6E" text-anchor="start">set by the company; you can&#x27;t see them</text><rect x="40" y="164" width="520" height="62" rx="16" fill="#EADFDB" stroke="#A08077" stroke-width="2"/><text x="58" y="198" font-size="18" font-weight="700" fill="#1F2230" text-anchor="start">Your custom instructions</text><text x="58" y="216" font-size="14" font-weight="500" fill="#5A5E6E" text-anchor="start">&quot;read my rucksack&#x27;s START.md first&quot;</text><rect x="40" y="238" width="520" height="62" rx="16" fill="#EADFDB" stroke="#A08077" stroke-width="2"/><text x="58" y="272" font-size="18" font-weight="700" fill="#1F2230" text-anchor="start">Your rucksack&#x27;s start page</text><text x="58" y="290" font-size="14" font-weight="500" fill="#5A5E6E" text-anchor="start">who you are, your rules, how you like to learn</text><rect x="40" y="312" width="520" height="62" rx="16" fill="#FFFFFF" stroke="#313547" stroke-width="2"/><text x="58" y="346" font-size="18" font-weight="700" fill="#1F2230" text-anchor="start">Your first message</text><text x="58" y="364" font-size="14" font-weight="500" fill="#5A5E6E" text-anchor="start">what you type</text><defs><marker id="a313547" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#313547"/></marker><marker id="s313547" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" fill="#313547"/></marker></defs><line x1="564" y1="260" x2="640" y2="260" stroke="#313547" stroke-width="2.5" marker-end="url(#a313547)"/><rect x="644" y="214" width="216" height="92" rx="16" fill="#313547" stroke="#313547" stroke-width="2"/><text x="752.0" y="248" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">The reply</text><text x="752.0" y="274" font-size="15" font-weight="500" fill="#EADFDB" text-anchor="middle">already knows you</text><rect x="40" y="392" width="820" height="60" rx="14" fill="none" stroke="#A08077" stroke-width="2" stroke-dasharray="6 6"/><text x="450" y="428" font-size="16" font-weight="600" fill="#1F2230" text-anchor="middle">All of it sits in the context window: the model&#x27;s working memory for this chat</text></svg>