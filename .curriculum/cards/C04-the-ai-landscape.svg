ect x="661" y="108" width="195" height="250" rx="16" fill="#EADFDB" stroke="#A08077" stroke-width="2"/><text x="758.5" y="142" font-size="19" font-weight="700" fill="#1F2230" text-anchor="middle"></text><text x="675" y="140" font-size="16" font-weight="800" fill="#1F2230" text-anchor="start">Personal agents</text><text x="675" y="162" font-size="12" font-weight="600" fill="#7C5F57" text-anchor="start">always on, act for you</text><text x="675" y="196" font-size="14" font-weight="500" fill="#1F2230" text-anchor="start">Meta Muse</text><text x="675" y="222" font-size="14" font-weight="500" fill="#1F2230" text-anchor="start">ChatGPT Dots</text><text x="675" y="248" font-size="14" font-weight="500" fill="#1F2230" text-anchor="start">Gemini Spark</text><text x="675" y="274" font-size="14" font-weight="500" fill="#1F2230" text-anchor="start"></text><text x="675" y="300" font-size="14" font-weight="500" fill="#1F2230" text-anchor="start">OpenClaw (run your own)</text><rect x="40" y="378" width="820" height="56" rx="14" fill="#313547"/><text x="450" y="412" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Underneath them all: models (GPT, Claude, Gemini and more), changing every month or two</text></svg>