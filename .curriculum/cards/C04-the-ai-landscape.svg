<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="Four kinds of AI tool: chat assistants, personal agents, coding agents and AI inside work tools, with examples; models sit underneath them all" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif"><rect width="900" height="520" rx="24" fill="#EFEDEC"/><text x="40" y="56" font-size="26" font-weight="800" fill="#1F2230" text-anchor="start">The AI landscape, October 2026</text><rect x="40" y="86" width="400" height="156" rx="16" fill="#FFFFFF" stroke="#E3DFDD" stroke-width="2"/><text x="58" y="120" font-size="19" font-weight="700" fill="#1F2230" text-anchor="start">Chat assistants</text><text x="58" y="142" font-size="14" font-weight="600" fill="#7C5F57" text-anchor="start">you ask, it answers</text><text x="58" y="172" font-size="15" font-weight="500" fill="#1F2230" text-anchor="start">ChatGPT · Claude</text><text x="58" y="194" font-size="15" font-weight="500" fill="#1F2230" text-anchor="start">Gemini · Microsoft Copilot</text><rect x="460" y="86" width="400" height="156" rx="16" fill="#FFFFFF" stroke="#E3DFDD" stroke-width="2"/><text x="478" y="120" font-size="19" font-weight="700" fill="#1F2230" text-anchor="start">Personal agents</text><text x="478" y="142" font-size="14" font-weight="600" fill="#7C5F57" text-anchor="start">always on, act for you</text><text x="478" y="172" font-size="15" font-weight="500" fill="#1F2230" text-anchor="start">OpenClaw · Meta Muse</text><text x="478" y="194" font-size="15" font-weight="500" fill="#1F2230" text-anchor="start">ChatGPT Dots</text><rect x="40" y="256" width="400" height="156" rx="16" fill="#FFFFFF" stroke="#E3DFDD" stroke-width="2"/><text x="58" y="290" font-size="19" font-weight="700" fill="#1F2230" text-anchor="start">Coding agents</text><text x="58" y="312" font-size="14" font-weight="600" fill="#7C5F57" text-anchor="start">work in your files, run commands</text><text x="58" y="342" font-size="15" font-weight="500" fill="#1F2230" text-anchor="start">Claude Code · Codex</text><text x="58" y="364" font-size="15" font-weight="500" fill="#1F2230" text-anchor="start">Cursor</text><rect x="460" y="256" width="400" height="156" rx="16" fill="#FFFFFF" stroke="#E3DFDD" stroke-width="2"/><text x="478" y="290" font-size="19" font-weight="700" fill="#1F2230" text-anchor="start">AI inside your work tools</text><text x="478" y="312" font-size="14" font-weight="600" fill="#7C5F57" text-anchor="start">where you already work</text><text x="478" y="342" font-size="15" font-weight="500" fill="#1F2230" text-anchor="start">Copilot in Microsoft 365</text><text x="478" y="364" font-size="15" font-weight="500" fill="#1F2230" text-anchor="start">Gemini in Google Workspace</text><text x="478" y="386" font-size="15" font-weight="500" fill="#1F2230" text-anchor="start">ChatGPT Work · Claude Cowork</text><rect x="40" y="436" width="820" height="56" rx="14" fill="#313547"/><text x="450" y="470" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Underneath them all: models (GPT, Claude, Gemini and more), which change every few months</text></svg>