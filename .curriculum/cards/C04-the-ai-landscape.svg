<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-label="Four kinds of AI tool, from least to most independent: chat assistants, AI inside your tools, agents that do a job, personal agents; models underneath them all" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif"><rect width="900" height="460" rx="24" fill="#EFEDEC"/><text x="40" y="56" font-size="26" font-weight="800" fill="#1F2230" text-anchor="start">The AI landscape, October 2026</text><text x="40" y="92" font-size="15" font-weight="700" fill="#7C5F57" text-anchor="start">From least to most independent</text><defs><marker id="aA08077" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#A08077"/></marker><marker id="sA08077" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" fill="#A08077"/></marker></defs><line x1="300" y1="87" x2="860" y2="87" stroke="#A08077" stroke-width="2.5" marker-end="url(#aA08077)"/><rect x="40" y="108" width="195" height="250" rx="16" fill="#FFFFFF" stroke="#E3DFDD" stroke-width="2"/><text x="137.5" y="142" font-size="19" font-weight="700" fill="#1F2230" text-anchor="middle"></text><text x="54" y="140" font-size="16" font-weight="800" fill="#1F2230" text-anchor="start">Chat assistants</text><text x="54" y="162" font-size="12" font-weight="600" fill="#7C5F57" text-anchor="start">you ask, it answers</text><text x="54" y="196" font-size="14" font-weight="500" fill="#1F2230" text-anchor="start">ChatGPT</text><text x="54" y="222" font-size="14" font-weight="500" fill="#1F2230" text-anchor="start">Claude</text><text x="54" y="248" font-size="14" font-weight="500" fill="#1F2230" text-anchor="start">Gemini</text><text x="54" y="274" font-size="14" font-weight="500" fill="#1F2230" text-anchor="start">Microsoft Copilot</text><text x="54" y="300" font-size="14" font-weight="500" fill="#1F2230" tex