<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="Without Rucksack, each AI app keeps its own slice of you. With it, the apps you connect read one private set of files you own" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif"><rect width="900" height="440" rx="24" fill="#EFEDEC"/><text x="40" y="56" font-size="26" font-weight="800" fill="#1F2230" text-anchor="start">What Rucksack is</text><text x="40" y="100" font-size="16" font-weight="700" fill="#5A5E6E" text-anchor="start">Without it: each app keeps its own slice of you</text><rect x="40" y="116" width="116" height="96" rx="16" fill="#FFFFFF" stroke="#E3DFDD" stroke-width="2"/><text x="98.0" y="150" font-size="16" font-weight="700" fill="#1F2230" text-anchor="middle">ChatGPT</text><rect x="52" y="160" width="92" height="22" rx="11" fill="#EADFDB"/><text x="98.0" y="175" font-size="11" font-weight="600" fill="#7C5F57" text-anchor="middle">its own memory</text><text x="98" y="202" font-size="12" font-weight="500" fill="#5A5E6E" text-anchor="middle">a slice of you</text><rect x="170" y="116" width="116" height="96" rx="16" fill="#FFFFFF" stroke="#E3DFDD" stroke-width="2"/><text x="228.0" y="150" font-size="16" font-weight="700" fill="#1F2230" text-anchor="middle">Claude</text><rect x="182" y="160" width="92" height="22" rx="11" fill="#EADFDB"/><text x="228.0" y="175" font-size="11" font-weight="600" fill="#7C5F57" text-anchor="middle">its own memory</text><text x="228" y="202" font-size="12" font-weight="500" fill="#5A5E6E" text-anchor="middle">a slice of you</text><rect x="300" y="116" width="116" height="96" rx="16" fill="#FFFFFF" stroke="#E3DFDD" stroke-width="2"/><text x="358.0" y="150" font-size="16" font-weight="700" fill="#1F2230" text-anchor="middle">Gemini</text><rect x="312" y="160" width="92" height="22" rx="11" fill="#EADFDB"/><text x="358.0" y="175" font-size="11" font-weight="600" fill="#7C5F57" text-anchor="middle">its own memory</text><text x="358" y="202" font-size="12" font-weight="500" fill="#5A5E6E" text-anchor="middle">a slice of you</text><line x1="440" y1="96" x2="440" y2="330" stroke="#E3DFDD" stroke-width="2"/><text x="470" y="100" font-size="16" font-weight="700" fill="#313547" text-anchor="start">With Rucksack: one set of files, yours</text><rect x="470" y="108" width="180" height="204" rx="16" fill="#EADFDB" stroke="#A08077" stroke-width="2"/><text x="560.0" y="142" font-size="17" font-weight="700" fill="#1F2230" text-anchor="middle">Your rucksack</text><text x="560.0" y="168" font-size="13" font-weight="500" fill="#5A5E6E" text-anchor="middle">private, in your</text><text x="560.0" y="190" font-size="13" font-weight="500" fill="#5A5E6E" text-anchor="middle">own GitHub</text><text x="560.0" y="212" font-size="13" font-weight="500" fill="#5A5E6E" text-anchor="middle"></text><text x="560.0" y="234" font-size="13" font-weight="500" fill="#5A5E6E" text-anchor="middle">you can read</text><text x="560.0" y="256" font-size="13" font-weight="500" fill="#5A5E6E" text-anchor="middle">every line</text><rect x="549" y="280" width="22" height="17" rx="4" fill="none" stroke="#313547" stroke-width="2.5"/><path d="M554 280v-4a6 6 0 0 1 12 0v4" fill="none" stroke="#313547" stroke-width="2.5"/><rect x="690" y="108" width="170" height="60" rx="16" fill="#FFFFFF" stroke="#E3DFDD" stroke-width="2"/><text x="775.0" y="142" font-size="14" font-weight="700" fill="#1F2230" text-anchor="middle">Claude Code · Codex</text><text x="775" y="158" font-size="11" font-weight="600" fill="#7C5F57" text-anchor="middle">every chat</text><defs><marker id="a313547" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#313547"/></marker><marker id="s313547" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" fill="#313547"/></marker></defs><line x1="654" y1="138" x2="686" y2="138" stroke