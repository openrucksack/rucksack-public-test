<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-label="A connector lets an AI app reach your rucksack: sign in, then allow one repository; it can read and write only what you chose, and asks before saving unless you say always allow" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif"><rect width="900" height="500" rx="24" fill="#EFEDEC"/><text x="40" y="56" font-size="26" font-weight="800" fill="#1F2230" text-anchor="start">Connectors and permissions</text><rect x="40" y="96" width="190" height="110" rx="16" fill="#FFFFFF" stroke="#E3DFDD" stroke-width="2"/><text x="135.0" y="130" font-size="20" font-weight="700" fill="#1F2230" text-anchor="middle">ChatGPT</text><text x="135.0" y="156" font-size="15" font-weight="500" fill="#5A5E6E" text-anchor="middle">or Claude</text><rect x="670" y="96" width="190" height="110" rx="16" fill="#EADFDB" stroke="#A08077" stroke-width="2"/><text x="765.0" y="130" font-size="20" font-weight="700" fill="#1F2230" text-anchor="middle">rucksack</text><text x="765.0" y="156" font-size="15" font-weight="500" fill="#5A5E6E" text-anchor="middle">in your GitHub</text><rect x="270" y="96" width="360" height="110" rx="16" fill="#FFFFFF" stroke="#313547" stroke-width="2"/><text x="450" y="126" font-size="17" font-weight="800" fill="#1F2230" text-anchor="middle">The connector: two parts</text><text x="290" y="160" font-size="15" font-weight="600" fill="#1F2230" text-anchor="start">1  Sign in, in the app&#x27;s settings</text><text x="290" y="188" font-size="15" font-weight="600" fill="#1F2230" text-anchor="start">2  Allow one repository, on GitHub</text><defs><marker id="a313547" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#313547"/></marker><marker id="s313547" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" fill="#313547"/></marker></defs><line x1="234" y1="151" x2="266" y2="151" stroke="#313547" stroke-width="2.5" marker-end="url(#a313547)" marker-start="url(#s313547)"/><defs><marker id="a313547" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#313547"/></marker><marker id="s313547" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" fill="#313547"/></marker></defs><line x1="634" y1="151" x2="666" y2="151" stroke="#313547" stroke-width="2.5" marker-end="url(#a313547)" marker-start="url(#s313547)"/><text x="40" y="262" font-size="19" font-weight="800" fill="#1F2230" text-anchor="start">What it may do</text><rect x="40" y="280" width="260" height="92" rx="16" fill="#FFFFFF" stroke="#E3DFDD" stroke-width="2"/><text x="58" y="314" font-size="18" font-weight="700" fill="#1F2230" text-anchor="start">Read</text><text x="58" y="340" font-size="15" font-weight="500" fill="#5A5E6E" text-anchor="start">see your files</text><rect x="320" y="280" width="260" height="92" rx="16" fill="#FFFFFF" stroke="#E3DFDD" stroke-width="2"/><text x="338" y="314" font-size="18" font-weight="700" fill="#1F2230" text-anchor="start">Write</text><text x="338" y="340" font-size="15" font-weight="500" fill="#5A5E6E" text-anchor="start">save changes for you</text><rect x="600" y="280" width="260" height="92" rx="16" fill="#EADFDB" stroke="#A08077" stroke-width="2"/><text x="618" y="314" font-size="18" font-weight="700" fill="#1F2230" text-anchor="start">Only these</text><text x="618" y="340" font-size="15" font-weight="500" fill="#5A5E6E" text-anchor="start">you chose: just rucksack</text><text x="40" y="422" font-size="19" font-weight="800" fill="#1F2230" text-anchor="start">When it saves, the app checks with you</text><rect x="40" y="442" width="226" height="28" rx="14" fill="#FFFFFF"/><text x="152.84" y="461" font-size="14" font-weight="700" fill="#313547" text-anchor="middle">Allow once: asks every time</text><rect x="330" y="442" width="367" height="28" rx="14" fill="#EADFDB"/><text x="513.4" y="461" font-size="14" font-weight="700" fill="#313547" text-anchor="middle">Always allow: trusts this app for this action</text></svg>