<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 516" width="900" height="516" role="img" aria-label="Connecting GitHub takes two steps: sign in (who you are) and install on rucksack only (what it may open). It can open only what both allow, and asks before saving" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif"><rect width="900" height="516" rx="24" fill="#EFEDEC"/><text x="40" y="56" font-size="26" font-weight="800" fill="#1F2230" text-anchor="start">Connecting GitHub: two steps</text><rect x="40" y="96" width="190" height="120" rx="16" fill="#FFFFFF" stroke="#E3DFDD" stroke-width="2"/><text x="135.0" y="130" font-size="20" font-weight="700" fill="#1F2230" text-anchor="middle">ChatGPT</text><text x="135.0" y="156" font-size="15" font-weight="500" fill="#5A5E6E" text-anchor="middle">or Claude</text><rect x="670" y="96" width="190" height="120" rx="16" fill="#EADFDB" stroke="#A08077" stroke-width="2"/><text x="765.0" y="130" font-size="20" font-weight="700" fill="#1F2230" text-anchor="middle">rucksack</text><text x="765.0" y="156" font-size="15" font-weight="500" fill="#5A5E6E" text-anchor="middle">in your GitHub</text><rect x="270" y="96" width="360" height="120" rx="16" fill="#FFFFFF" stroke="#313547" stroke-width="2"/><text x="290" y="132" font-size="17" font-weight="800" fill="#1F2230" text-anchor="start">1  Sign in</text><text x="390" y="132" font-size="15" font-weight="500" fill="#5A5E6E" text-anchor="start">who you are</text><text x="290" y="166" font-size="17" font-weight="800" fill="#1F2230" text-anchor="start">2  Install on rucksack only</text><text x="320" y="190" font-size="15" font-weight="500" fill="#5A5E6E" text-anchor="start">what it may open</text><defs><marker id="a313547" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#313547"/></marker><marker id="s313547" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" fill="#313547"/></marker></defs><line x1="234" y1="156" x2="266" y2="156" stroke="#313547" stroke-width="2.5" marker-end="url(#a313547)" marker-start="url(#s313547)"/><defs><marker id="a313547" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#313547"/></marker><marker id="s313547" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" fill="#313547"/></marker></defs><line x1="634" y1="156" x2="666" y2="156" stroke="#313547" stroke-width="2.5" marker-end="url(#a313547)" marker-start="url(#s313547)"/><text x="450" y="246" font-size="15" font-weight="600" fill="#7C5F57" text-anchor="middle">Like a hotel key card: it opens only what both steps allow</text><text x="40" y="292" font-size="19" font-weight="800" fill="#1F2230" text-anchor="start">What it may do</text><rect x="40" y="310" width="260" height="84" rx="16" fill="#FFFFFF" stroke="#E3DFDD" stroke-width="2"/><text x="58" y="344" font-size="18" font-weight="700" fill="#1F2230" text-anchor="start">Read</text><text x="58" y="370" font-size="15" font-weight="500" fill="#5A5E6E" text-anchor="start">see your files</text><rect x="320" y="310" width="260" height="84" rx="16" fill="#FFFFFF" stroke="#E3DFDD" stroke-width="2"/><text x="338" y="344" font-size="18" font-weight="700" fill="#1F2230" text-anchor="start">Save</text><text x="338" y="370" font-size="15" font-weight="500" fill="#5A5E6E" text-anchor="start">change files, if the app can</text><rect x="600" y="310" width="260" height="84" rx="16" fill="#EADFDB" stroke="#A08077" stroke-width="2"/><text x="618" y="344" font-size="18" font-weight="700" fill="#1F2230" text-anchor="start">Only rucksack</text><text x="618" y="370" font-size="15" font-weight="500" fill="#5A5E6E" text-anchor="start">nothing else you own</text><text x="40" y="440" font-size="19" font-weight="800" fill="#1F2230" text-anchor="start">Before saving, the app may check with you</text><rect x="40" y="458" width="218" height="28" rx="14" fill="#FFFFFF"/><text x="148.92000000000002" y="477" font-size="14" font-weight="700" fill="#313547" text-anchor="middle">Allow once: asks each time</text><rect x="318" y="458" width="382" height="28" rx="14" fill="#EADFDB"/><text x="509.24" y="477" font-size="14" font-weight="700" fill="#313547" text-anchor="middle">Always allow: stops asking (where it&#x27;s offered)</text></svg>