name: tidy
# The tidy, nightly and after each save. Rebuilds START.md, ACTIVITY.md and SKILLS.md, archives old notes,
# applies approved proposals, runs the privacy check into CHECK.md. No model, no key,
# no network beyond GitHub. Failures land in CHECK.md and the owner's email, never a
# red tab the person has to understand.
on:
  schedule:
    - cron: "0 17 * * *"   # 3am Brisbane (AEST is UTC+10)
  # Also straight after any save to the person's own files, so the start page and dashboard are
  # current within a minute. The tidy's own commit uses GITHUB_TOKEN, which never triggers a run.
  push:
    branches: [main]
    paths:
      - "USER.md"
      - "SOUL.md"
      - "LEARN.md"
      - "FLEET.md"
      - "MEMORY.md"
      - "HEARTBEAT.md"
      - "ONBOARDING.md"
      - "memory/**"
      - "skills/**"
      - "projects/**"
  workflow_dispatch:
concurrency:
  group: tidy
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  tidy:
    # Runs only in a person's own copy, never in the template or curriculum repos.
    if: github.repository_owner != 'openrucksack'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the tidy
        run: python3 -I -B scripts/tidy.py .
      - name: Secrets scan (gitleaks, free on personal repos)
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
      - name: Commit what changed
        run: |
          git config user.name "rucksack tidy"
          git config user.email "tidy@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "tidy: $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash || true
          git push
